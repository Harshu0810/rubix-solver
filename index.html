<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RuBiX Solver — 3×3 Rubik's Cube 3D Solver Engine</title>
  <meta name="description" content="Free 3x3 Rubik's cube solver with step-by-step interactive 3D playback. Enter your cube faces and compute optimal solutions in milliseconds." />
  <meta name="keywords" content="rubiks cube solver, 3x3 solver, kociemba algorithm, 3d rubik cube, speedcube solver" />
  <meta name="theme-color" content="#0C111C" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self';" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/styles/index.css" />
  <link rel="stylesheet" href="/src/styles/animations.css" />
</head>
<body>
  <div id="app">
    <!-- Navigation Bar -->
    <header class="navbar">
      <div class="nav-brand" data-route="/">
        <div class="brand-icon">
          <div class="brand-icon-cell" style="background: #EF4444;"></div>
          <div class="brand-icon-cell" style="background: #3B82F6;"></div>
          <div class="brand-icon-cell" style="background: #10B981;"></div>
          <div class="brand-icon-cell" style="background: #FACC15;"></div>
        </div>
        <span>RuBiX Solver</span>
      </div>

      <nav>
        <ul class="nav-links">
          <li>
            <button class="nav-btn active" data-route="/">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span>Home</span>
            </button>
          </li>
          <li>
            <button class="nav-btn nav-btn-highlight" data-route="/input">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
              <span>Solve Cube</span>
            </button>
          </li>
          <li>
            <button class="nav-btn" data-route="/manual">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              <span>Manual</span>
            </button>
          </li>
          <li>
            <button class="nav-btn" data-route="/feedback">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>Feedback</span>
            </button>
          </li>
          <li id="nav-auth-item">
            <!-- Dynamically populated with Sign In or User Profile -->
          </li>
        </ul>
      </nav>
    </header>

    <!-- Main View Outlet for Routing -->
    <main id="view-outlet" style="flex: 1; display: flex; flex-direction: column; width: 100%;"></main>

    <!-- Global Footer -->
    <footer class="no-print" style="border-top: 1px solid var(--border-subtle); padding: 24px; text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: auto;">
      <div style="max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <div>
          © 2026 RuBiX Solver Engine. Powered by Kociemba Two-Phase Algorithm & Three.js.
        </div>
        <div style="display: flex; gap: 16px;">
          <a href="#" data-route="/manual" style="color: var(--text-muted); text-decoration: none;">Beginner Guide</a>
          <a href="#" data-route="/feedback" style="color: var(--text-muted); text-decoration: none;">Give Feedback</a>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
